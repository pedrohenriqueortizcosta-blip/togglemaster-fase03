name: evaluation-service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yml"

permissions:
  contents: read

env:
  SERVICE_NAME: evaluation-service
  GO_VERSION: "1.25"

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: evaluation-service/go.sum

      - name: Build
        run: go build -v ./...

      - name: Unit tests
        run: go test -v ./...

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: evaluation-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: evaluation-service
          version: latest
          args: --timeout=5m

  security-scan:
    name: "Security Scan (SAST & SCA)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: evaluation-service/go.sum

      # SCA: known vulnerabilities in dependencies (go.sum)
      - name: Trivy SCA (filesystem scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: evaluation-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # SAST: vulnerabilities/bad patterns in our own source code.
      # gosec has no separate CRITICAL tier, so HIGH is the practical
      # equivalent for the "fail on critical" blocking rule.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: gosec (fails on HIGH severity)
        run: gosec -severity high -confidence high ./...

  docker-build-push:
    name: Docker Build & Push
    needs: [build-test, lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "image_tag=v1.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t "${{ steps.ecr-login.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.image_tag }}" .

      - name: Trivy image scan (fail on CRITICAL, before pushing)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ steps.ecr-login.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.image_tag }}"
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        run: |
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.image_tag }}"

  update-gitops:
    name: Update GitOps manifest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump image tag in gitops manifest
        run: |
          NEW_IMAGE="${{ needs.docker-build-push.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ needs.docker-build-push.outputs.image_tag }}"
          sed -i "s#image: .*${{ env.SERVICE_NAME }}:.*#image: ${NEW_IMAGE}#" gitops/${{ env.SERVICE_NAME }}/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/${{ env.SERVICE_NAME }}/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: bump ${{ env.SERVICE_NAME }} image to ${{ needs.docker-build-push.outputs.image_tag }}"
            git pull --rebase origin main
            git push
          fi
