apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: evaluation-service
  labels:
    app: evaluation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service
      containers:
        - name: evaluation-service
          image: 108101918154.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:v1.0.0-7521f26
          ports:
            - containerPort: 8004
          env:
            - name: FLAG_SERVICE_URL
              value: "http://flag-service.flag-service.svc.cluster.local:8002"
            - name: TARGETING_SERVICE_URL
              value: "http://targeting-service.targeting-service.svc.cluster.local:8003"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_SQS_URL
              value: "https://sqs.us-east-1.amazonaws.com/108101918154/togglemaster-evaluation-service"
          envFrom:
            - configMapRef:
                name: evaluation-service-config
            - secretRef:
                name: evaluation-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 20
